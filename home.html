<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Genesis Gacha Store - Home</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
  body {
    background-color: #08070a;
    color: #ffffff;
    min-height: 100vh;
    padding: 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow-x: hidden;
    position: relative;
  }
  /* Lebdece iskre u pozadini */
  .sky { position: fixed; inset: 0; pointer-events: none; z-index: 1; overflow: hidden; }
  @keyframes rise {
    0% { transform: translateY(0) scale(0.7); opacity: 0; }
    25% { opacity: 0.9; }
    85% { opacity: 0.7; }
    100% { transform: translateY(-100vh) scale(1.2); opacity: 0; }
  }
  .spark { position: absolute; bottom: -10px; border-radius: 50%; opacity: 0; }
  .s1 { left: 8%; width: 4px; height: 4px; background: #ffcc00; box-shadow: 0 0 10px #ffcc00; animation: rise 8s infinite 0.5s; }
  .s2 { left: 22%; width: 3px; height: 3px; background: #e879f9; box-shadow: 0 0 10px #e879f9; animation: rise 10s infinite 2s; }
  .s3 { left: 38%; width: 5px; height: 5px; background: #fde047; box-shadow: 0 0 12px #fde047; animation: rise 9s infinite 4s; }
  .s4 { left: 54%; width: 4px; height: 4px; background: #c084fc; box-shadow: 0 0 10px #c084fc; animation: rise 11s infinite 1.2s; }
  .s5 { left: 71%; width: 3px; height: 3px; background: #ffffff; box-shadow: 0 0 9px #ffcc00; animation: rise 8.5s infinite 3.3s; }
  .s6 { left: 86%; width: 5px; height: 5px; background: #ffcc00; box-shadow: 0 0 12px #ff8800; animation: rise 10.5s infinite 5s; }
  .s7 { left: 94%; width: 4px; height: 4px; background: #f0abfc; box-shadow: 0 0 10px #f0abfc; animation: rise 9.2s infinite 1.8s; }

  /* Glavni okvir banera */
  @keyframes frameGlow {
    0%, 100% { border-color: #9333ea; box-shadow: 0 10px 35px rgba(0, 0, 0, 0.9), 0 0 25px rgba(168, 85, 247, 0.5); }
    50% { border-color: #f0abfc; box-shadow: 0 10px 40px rgba(0, 0, 0, 0.95), 0 0 40px rgba(217, 70, 239, 0.8), 0 0 18px rgba(255, 204, 0, 0.45); }
  }
  @keyframes shineSweep {
    0% { left: -100%; }
    35%, 100% { left: 150%; }
  }
  .hero-container {
    width: 100%;
    max-width: 1080px;
    position: relative;
    z-index: 2;
    border-radius: 16px;
    overflow: hidden;
    border: 2.5px solid #a855f7;
    background: #0d0717;
    animation: frameGlow 4.5s infinite ease-in-out;
  }
  .hero-container::after {
    content: "";
    position: absolute;
    top: 0; left: -100%;
    width: 45%; height: 100%;
    background: linear-gradient(120deg, transparent, rgba(255, 255, 255, 0.14), transparent);
    transform: skewX(-25deg);
    animation: shineSweep 7s infinite ease-in-out;
    pointer-events: none;
  }
  .hero-container img {
    width: 100%;
    height: auto;
    display: block;
  }

  /* Akcijska traka ispod slike za lak klik na PC i mobitelu */
  .action-bar {
    width: 100%;
    max-width: 1080px;
    margin-top: 14px;
    position: relative;
    z-index: 2;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 12px;
  }
  .btn-catalog {
    background: linear-gradient(90deg, #581c87 0%, #9333ea 50%, #581c87 100%);
    color: #ffe680;
    border: 2px solid #ffcc00;
    border-radius: 10px;
    padding: 13px 26px;
    font-size: 15px;
    font-weight: 900;
    letter-spacing: 1px;
    text-transform: uppercase;
    text-decoration: none;
    box-shadow: 0 4px 18px rgba(147, 51, 234, 0.55);
    transition: transform 0.2s ease, box-shadow 0.2s ease;
    text-align: center;
  }
  .btn-catalog:hover {
    transform: translateY(-2px) scale(1.02);
    box-shadow: 0 0 25px rgba(255, 204, 0, 0.85);
    color: #ffffff;
  }
  .btn-discord {
    background: linear-gradient(90deg, #1e2447 0%, #5865F2 50%, #1e2447 100%);
    color: #ffffff;
    border: 2px solid #8ea1e1;
    border-radius: 10px;
    padding: 13px 22px;
    font-size: 14px;
    font-weight: 800;
    letter-spacing: 0.6px;
    cursor: pointer;
    box-shadow: 0 4px 18px rgba(88, 101, 242, 0.45);
    transition: transform 0.2s ease, background 0.2s ease;
  }
  .btn-discord:hover {
    transform: translateY(-2px);
    border-color: #ffcc00;
  }

  /* Prilagodba za mobitele */
  @media (max-width: 640px) {
    body { padding: 10px; }
    .hero-container { border-radius: 10px; border-width: 2px; }
    .action-bar { flex-direction: column; gap: 10px; }
    .btn-catalog, .btn-discord { width: 100%; padding: 12px 16px; font-size: 13.5px; }
  }
</style>
</head>
<body>
  <div class="sky">
    <div class="spark s1"></div><div class="spark s2"></div><div class="spark s3"></div>
    <div class="spark s4"></div><div class="spark s5"></div><div class="spark s6"></div><div class="spark s7"></div>
  </div>

  <div class="hero-container">
    <img src="slike/home_banner.png" alt="Genesis Gacha Store">
  </div>

  <div class="action-bar">
    <a href="https://github.io" target="_top" class="btn-catalog">🔥 Browse Bleach: Soul Resonance Catalog</a>
    <button type="button" class="btn-discord" onclick="kopirajDC(this)">📋 Copy Discord: GenesisGacha#0271</button>
  </div>

  <script>
    function kopirajDC(btn) {
      navigator.clipboard.writeText('GenesisGacha#0271');
      btn.innerText = '✔ Discord Copied!';
      setTimeout(() => { btn.innerText = '📋 Copy Discord: GenesisGacha#0271'; }, 2000);
    }
  </script>
</body>
</html>
